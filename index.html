<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audioknihy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

*,:before,:after{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #faf8f5;
  --bg2: #f3efe9;
  --card: #ffffff;
  --border: #e6e0d8;
  --text: #2c2418;
  --text2: #6b5e50;
  --muted: #a69882;
  --accent: #c2710c;
  --accent2: #a35d08;
  --accent-soft: rgba(194,113,12,0.08);
  --accent-glow: rgba(194,113,12,0.15);
  --hover: rgba(194,113,12,0.04);
  --shadow-sm: 0 1px 2px rgba(44,36,24,0.04);
  --shadow: 0 2px 8px rgba(44,36,24,0.06);
  --shadow-lg: 0 8px 24px rgba(44,36,24,0.1);
  --radius: 10px;
  --highlight: #fef7e6;
  --toolbar-bg: rgba(250,248,245,0.82);
}

[data-theme="dark"] {
  --bg: #18150f;
  --bg2: #211d16;
  --card: #2a251d;
  --border: #3d362b;
  --text: #ede8e0;
  --text2: #a69882;
  --muted: #7a6e5f;
  --accent: #e8a230;
  --accent2: #f0b652;
  --accent-soft: rgba(232,162,48,0.1);
  --accent-glow: rgba(232,162,48,0.18);
  --hover: rgba(232,162,48,0.05);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.15);
  --shadow: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.35);
  --highlight: #3a2f1a;
  --toolbar-bg: rgba(24,21,15,0.82);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ─── HEADER ─── */
.header {
  max-width: 980px;
  margin: 0 auto;
  padding: 2.5rem 2rem 1.2rem;
}
.header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}
.header h1 {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.2;
}
.subtitle {
  color: var(--muted);
  font-size: 0.88rem;
  margin-top: 0.2rem;
  font-style: italic;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 1rem;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 0.35rem 0.8rem;
  border-radius: 8px;
  font-size: 0.8rem;
  color: var(--text2);
  box-shadow: var(--shadow-sm);
}
.stat b { color: var(--text); font-weight: 600; }

/* ─── THEME TOGGLE ─── */
.theme-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s ease, background 0.2s, border-color 0.2s;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.theme-btn:hover { transform: rotate(25deg); border-color: var(--accent); }
.theme-btn svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── STICKY TOOLBAR ─── */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--toolbar-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.toolbar.scrolled {
  border-bottom-color: var(--border);
  box-shadow: var(--shadow);
}
.toolbar-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 0.65rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.search-row {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.search-wrap {
  flex: 1;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 0.55rem 0.9rem;
  padding-right: 2.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.9rem;
  font-family: inherit;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow-sm);
}
.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-wrap input::placeholder { color: var(--muted); }
.search-kbd {
  position: absolute;
  right: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.7rem;
  font-family: inherit;
  font-weight: 600;
  color: var(--muted);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.1rem 0.4rem;
  pointer-events: none;
  line-height: 1.4;
}

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.5rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text2);
  font-size: 0.82rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  box-shadow: var(--shadow-sm);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ─── SORT & ALPHA ─── */
.controls-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.sort-group {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}
.sort-label {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-right: 0.15rem;
}
.sort-btn {
  padding: 0.25rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--text2);
  font-size: 0.76rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.sort-btn:hover { border-color: var(--accent); color: var(--accent); }
.sort-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.sep { width: 1px; height: 18px; background: var(--border); margin: 0 0.25rem; flex-shrink: 0; }

.alpha-nav {
  display: flex;
  gap: 1px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  flex: 1;
  min-width: 0;
}
.alpha-nav::-webkit-scrollbar { display: none; }
.alpha-btn {
  min-width: 26px; height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text2);
  transition: all 0.12s;
  flex-shrink: 0;
}
.alpha-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.alpha-btn.active { background: var(--accent); color: #fff; }
.alpha-btn:disabled { opacity: 0.25; cursor: default; }

/* ─── BOOK LIST ─── */
.list {
  max-width: 980px;
  margin: 0 auto;
  padding: 0.5rem 2rem 3rem;
}

.letter-section { scroll-margin-top: 140px; }

.author-head {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  padding: 1rem 0 0.3rem 0;
  margin-top: 0.25rem;
  border-left: 3px solid var(--accent);
  padding-left: 0.75rem;
}

.book {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.45rem 0.65rem;
  min-height: 2.75rem;
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--text);
  transition: background 0.15s, transform 0.12s;
  position: relative;
}
.book:hover { background: var(--hover); transform: translateX(2px); }
.book.highlighted {
  background: var(--highlight);
  animation: glow 2.5s ease-out forwards;
}
@keyframes glow {
  0%   { box-shadow: 0 0 0 0 var(--accent-glow); }
  30%  { box-shadow: 0 0 0 6px var(--accent-glow); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.book-info { flex: 1; min-width: 0; }
.book-title {
  font-size: 0.92rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.book-author-inline {
  font-size: 0.78rem;
  color: var(--muted);
  display: none;
}
.flat-mode .book-author-inline { display: block; }

.book-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.book-date {
  display: none;
  min-width: 5rem;
  text-align: right;
}
.date-mode .book-date { display: block; }
.book-tracks { min-width: 3.5rem; text-align: right; }
.book-size { min-width: 3.5rem; text-align: right; font-weight: 500; color: var(--text2); }

/* ─── FOOTER ─── */
.footer {
  max-width: 980px;
  margin: 0 auto;
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
  padding: 1rem 2rem 2rem;
  border-top: 1px solid var(--border);
}

/* ─── BACK TO TOP ─── */
.top-btn {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
}
.top-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.top-btn:hover { border-color: var(--accent); color: var(--accent); }
.top-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--muted);
  font-size: 0.95rem;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 700px) {
  .header { padding: 1.5rem 1rem 1rem; }
  .header h1 { font-size: 1.5rem; }
  .toolbar-inner { padding: 0.5rem 1rem; }
  .list { padding: 0.5rem 1rem 2rem; }
  .footer { padding: 1rem; }
  .book-tracks { display: none; }
  .stats { gap: 0.35rem; }
  .stat { font-size: 0.74rem; padding: 0.25rem 0.55rem; }
  .controls-row { gap: 0.4rem; }
  .search-kbd { display: none; }
  .alpha-btn { min-width: 24px; height: 24px; font-size: 0.65rem; }
  .letter-section { scroll-margin-top: 120px; }
}
@media (max-width: 440px) {
  .book-date { min-width: auto; }
}
</style>
</head>

const generated='18.02.2026 04:08';
const totalAudio=10913;
const totalSize='168G';
/* ── Icons ── */
const IC_SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
const IC_MOON='<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
/* ── State ── */
let sortMode='author', filterQ='', observer=null;
const collator=new Intl.Collator('cs',{sensitivity:'base'});

/* ── Theme ── */
function initTheme(){
  const s=localStorage.getItem('ab-theme');
  const dark=s?s==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;
  setTheme(dark?'dark':'light');
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('ab-theme',t);
  document.getElementById('theme-toggle').innerHTML=t==='dark'?IC_SUN:IC_MOON;
}
function toggleTheme(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
}

/* ── Helpers ── */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function stripDia(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function slugify(s){return stripDia(s).replace(/[^a-zA-Z0-9 ]/g,'').trim().replace(/\s+/g,' ');}
function letterOf(author){return stripDia(author.charAt(0)).toUpperCase();}
function dbLink(a,t){
  const surname=a.split(',')[0].trim();
  return 'https://www.databazeknih.cz/search?q='+encodeURIComponent(slugify(t+' '+surname));
}
function fmtDate(epoch){
  if(!epoch)return '—';
  const d=new Date(epoch*1000);
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();
}

/* ── Sort ── */
function sortBooks(arr,mode){
  const c=[...arr];
  switch(mode){
    case 'author': c.sort((a,b)=>collator.compare(a.a,b.a)||collator.compare(a.t,b.t)); break;
    case 'title':  c.sort((a,b)=>collator.compare(a.t,b.t)); break;
    case 'tracks': c.sort((a,b)=>(b.n-a.n)||collator.compare(a.a,b.a)); break;
    case 'size':   c.sort((a,b)=>(b.b-a.b)||collator.compare(a.a,b.a)); break;
    case 'date':   c.sort((a,b)=>(b.d-a.d)||collator.compare(a.a,b.a)); break;
  }
  return c;
}

/* ── Alpha Nav ── */
function buildAlpha(visible){
  const present=new Set();
  visible.forEach(b=>{if(b.a)present.add(letterOf(b.a));});
  const nav=document.getElementById('alpha-nav');
  let h='';
  for(let i=65;i<=90;i++){
    const ch=String.fromCharCode(i), has=present.has(ch);
    h+='<button class="alpha-btn'+(has?'':' disabled')+'" data-letter="'+ch+'"'+(has?'':' disabled')+'>'+ch+'</button>';
  }
  nav.innerHTML=h;
}

function setupScrollSpy(){
  if(observer)observer.disconnect();
  const sections=document.querySelectorAll('.letter-section[data-letter]');
  if(!sections.length)return;
  observer=new IntersectionObserver(entries=>{
    for(const e of entries){
      if(e.isIntersecting){
        const l=e.target.getAttribute('data-letter');
        document.querySelectorAll('.alpha-btn').forEach(b=>b.classList.toggle('active',b.dataset.letter===l));
      }
    }
  },{rootMargin:'-100px 0px -75% 0px'});
  sections.forEach(s=>observer.observe(s));
}

/* ── Render ── */
function render(){
  const q=filterQ.toLowerCase();
  const filtered=books.filter(b=>{
    if(!q)return true;
    return (b.a+' '+b.t).toLowerCase().includes(q);
  });
  const sorted=sortBooks(filtered,sortMode);
  const list=document.getElementById('list');
  const isAuthor=sortMode==='author';
  const isDate=sortMode==='date';

  list.classList.toggle('flat-mode',!isAuthor);
  list.classList.toggle('date-mode',isDate);

  let html='';
  if(!sorted.length){
    html='<div class="empty">Žiadne výsledky pre „'+esc(filterQ)+'"</div>';
  } else if(isAuthor){
    let curAuthor='', curLetter='';
    sorted.forEach(b=>{
      const letter=letterOf(b.a);
      if(letter!==curLetter){
        if(curLetter)html+='</div>';
        curLetter=letter;
        html+='<div class="letter-section" id="letter-'+letter+'" data-letter="'+letter+'">';
      }
      if(b.a!==curAuthor){
        curAuthor=b.a;
        html+='<div class="author-head">'+esc(b.a)+'</div>';
      }
      html+=bookRow(b);
    });
    if(curLetter)html+='</div>';
  } else {
    sorted.forEach(b=>{html+=bookRow(b);});
  }

  list.innerHTML=html;

  // Stats
  document.getElementById('st-books').textContent=books.length;
  document.getElementById('st-authors').textContent=new Set(books.map(b=>b.a)).size;
  document.getElementById('st-audio').textContent=totalAudio.toLocaleString('sk');
  document.getElementById('st-size').textContent=totalSize;

  // Footer
  document.getElementById('footer').innerHTML=
    '<span>'+filtered.length+' zobrazených</span> · Aktualizované: '+generated;

  buildAlpha(filtered);
  setupScrollSpy();
}

function bookRow(b){
  return '<a class="book" href="'+dbLink(b.a,b.t)+'" target="_blank" rel="noopener">'
    +'<span class="book-info">'
    +'<span class="book-title">'+esc(b.t)+'</span>'
    +'<span class="book-author-inline">'+esc(b.a)+'</span>'
    +'</span>'
    +'<span class="book-meta">'
    +'<span class="book-date">'+fmtDate(b.d)+'</span>'
    +'<span class="book-tracks">'+(b.n||'\u2014')+' stôp</span>'
    +'<span class="book-size">'+b.s+'</span>'
    +'</span></a>';
}

/* ── Events ── */
// Search
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',e=>{filterQ=e.target.value;render();});

// Sort
document.querySelectorAll('.sort-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    sortMode=btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.sort===sortMode));
    render();
  });
});

// Alpha click
document.getElementById('alpha-nav').addEventListener('click',e=>{
  const b=e.target.closest('.alpha-btn');
  if(!b||b.disabled)return;
  const el=document.getElementById('letter-'+b.dataset.letter);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
});

// Random
document.getElementById('random-btn').addEventListener('click',()=>{
  document.querySelectorAll('.book.highlighted').forEach(el=>el.classList.remove('highlighted'));
  const b=books[Math.floor(Math.random()*books.length)];
  filterQ='';searchEl.value='';
  sortMode='author';
  document.querySelectorAll('.sort-btn').forEach(s=>s.classList.toggle('active',s.dataset.sort==='author'));
  render();
  requestAnimationFrame(()=>{
    const els=document.querySelectorAll('.book');
    for(const el of els){
      const ti=el.querySelector('.book-title');
      if(ti&&ti.textContent===b.t){
        el.classList.add('highlighted');
        el.scrollIntoView({behavior:'smooth',block:'center'});
        setTimeout(()=>el.classList.remove('highlighted'),3500);
        break;
      }
    }
  });
});

// Scroll: toolbar shadow + back-to-top
const topBtn=document.getElementById('top-btn'), toolbar=document.getElementById('toolbar');
window.addEventListener('scroll',()=>{
  topBtn.classList.toggle('visible',window.scrollY>400);
  toolbar.classList.toggle('scrolled',window.scrollY>10);
},{passive:true});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();searchEl.focus();}
  if(e.key==='Escape'){searchEl.value='';filterQ='';searchEl.blur();render();}
});

// Theme
document.getElementById('theme-toggle').addEventListener('click',toggleTheme);
initTheme();
render();
</script>

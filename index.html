<style>
  :root { --bg: #fafaf9; --card: #fff; --border: #e7e5e4; --text: #1c1917; --muted: #78716c; --accent: #b45309; --accent-light: #fef3c7; --hover: #f5f5f4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .header { padding: 2.5rem 2rem 1.5rem; max-width: 960px; margin: 0 auto; }
  .header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
  .header p { color: var(--muted); margin-top: .25rem; font-size: .9rem; }
  .stats { display: flex; gap: 2rem; margin-top: 1rem; font-size: .85rem; color: var(--muted); }
  .stats span { background: var(--card); border: 1px solid var(--border); padding: .3rem .75rem; border-radius: 6px; }
  .stats b { color: var(--text); }
  .search-box { max-width: 960px; margin: 0 auto; padding: 0 2rem .75rem; }
  .search-box input { width: 100%; padding: .6rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: .95rem; background: var(--card); outline: none; transition: border-color .2s; }
  .search-box input:focus { border-color: var(--accent); }
  .list { max-width: 960px; margin: 0 auto; padding: 0 2rem 3rem; }
  .author-group { margin-bottom: .25rem; }
  .author-name { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: .75rem 0 .25rem; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
  .book { display: flex; align-items: baseline; gap: .5rem; padding: .45rem .75rem; border-radius: 6px; text-decoration: none; color: var(--text); transition: background .15s; }
  .book:hover { background: var(--hover); }
  .book-title { flex: 1; font-size: .95rem; }
  .book-meta { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .book-size { display: inline-block; min-width: 3.5rem; text-align: right; }
  .book-tracks { display: inline-block; min-width: 2.5rem; text-align: right; margin-right: .25rem; color: #a8a29e; }
  .hidden { display: none; }
  .updated { text-align: center; color: var(--muted); font-size: .75rem; padding: 1rem; }
  @media (max-width: 640px) {
    .header, .search-box, .list { padding-left: 1rem; padding-right: 1rem; }
    .book-tracks { display: none; }
    .stats { gap: .75rem; flex-wrap: wrap; }
  }
</style>

const generated = '17.02.2026 17:12';
function slugify(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 ]/g,'').trim().replace(/\s+/g,' ');
}
function dbLink(author, title) {
  const surname = author.split(',')[0].trim();
  return 'https://www.databazeknih.cz/search?q=' + encodeURIComponent(slugify(title + ' ' + surname));
}
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function render(filter) {
  const list = document.getElementById('list');
  const q = (filter||'').toLowerCase();
  let html = '', currentAuthor = '', shown = 0;
  const authors = new Set();
  books.forEach(b => {
    const haystack = (b.a + ' ' + b.t).toLowerCase();
    if (q && !haystack.includes(q)) return;
    authors.add(b.a);
    if (b.a !== currentAuthor) {
      currentAuthor = b.a;
      html += '<div class="author-group"><div class="author-name">' + esc(b.a) + '</div>';
    }
    html += '<a class="book" href="' + dbLink(b.a, b.t) + '" target="_blank" rel="noopener">'
      + '<span class="book-title">' + esc(b.t) + '</span>'
      + '<span class="book-meta">'
      + '<span class="book-tracks">' + (b.n || '\u2014') + ' mp3</span>'
      + '<span class="book-size">' + b.s + '</span>'
      + '</span></a>';
    shown++;
  });
  list.innerHTML = html;
  document.getElementById('count-total').textContent = books.length;
  document.getElementById('count-authors').textContent = new Set(books.map(b=>b.a)).size;
  document.getElementById('count-shown').textContent = shown;
  document.getElementById('updated').textContent = 'Aktualizované: ' + generated;
}
document.getElementById('search').addEventListener('input', e => render(e.target.value));
render();
